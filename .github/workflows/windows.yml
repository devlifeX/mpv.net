name: Windows portable build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained Windows x64 package
        shell: pwsh
        run: ./src/Tools/build-portable.ps1
      - uses: msys2/setup-msys2@v2
        with:
          install: gettext
      - name: Compile translations
        shell: msys2 {0}
        run: |
          set -euo pipefail
          for po in lang/po/*.po; do
            language="$(basename "$po" .po)"
            destination="artifacts/mpv.net-win-x64/Locale/$language/LC_MESSAGES"
            mkdir -p "$destination"
            msgfmt "$po" -o "$destination/mpvnet.mo"
          done
      - name: Check packaged native libraries and player startup on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'artifacts/mpv.net-win-x64'
          # An installed Vulkan SDK on the runner must not hide a missing package DLL.
          $loader = Join-Path $package 'vulkan-1.dll'
          if (-not (Test-Path $loader)) { throw 'Packaged Vulkan loader is missing.' }
          $handle = [Runtime.InteropServices.NativeLibrary]::Load($loader)
          try {
            [Runtime.InteropServices.NativeLibrary]::GetExport($handle, 'vkGetInstanceProcAddr') | Out-Null
            $loaded = [Diagnostics.Process]::GetCurrentProcess().Modules |
              Where-Object { $_.ModuleName -ieq 'vulkan-1.dll' }
            if ($loaded.FileName -ine $loader) { throw 'Vulkan loader was loaded from outside the package.' }
          } finally {
            [Runtime.InteropServices.NativeLibrary]::Free($handle)
          }
          & "$package/ffmpeg.exe" -version
          if ($LASTEXITCODE) { throw 'Packaged FFmpeg failed to start.' }
          $config = Join-Path $env:RUNNER_TEMP 'mpvnet-smoke-config'
          New-Item $config -ItemType Directory -Force | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP 'mpvnet-version.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'mpvnet-errors.txt'
          $workingDirectory = Join-Path $env:RUNNER_TEMP 'unrelated working directory'
          New-Item $workingDirectory -ItemType Directory -Force | Out-Null
          $process = Start-Process "$package/mpvnet.com" -ArgumentList @(
            '--version', '--process-instance=multi', "--config-dir=$config"
          ) -WorkingDirectory $workingDirectory -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill($true)
            throw 'Packaged player startup timed out.'
          }
          $output = Get-Content $stdout -Raw
          Get-Content $stderr
          Write-Output $output
          if ($process.ExitCode -ne 0 -or $output -notmatch 'mpv.net v' -or $output -notmatch 'mpv v') {
            throw 'Packaged player did not initialize libmpv and report its version.'
          }
          if (-not (Get-ChildItem "$package/Locale" -Recurse -Filter '*.mo')) {
            throw 'Compiled translations are missing.'
          }
      - name: Start and close the packaged Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'artifacts/mpv.net-win-x64'
          $pipeName = 'mpvnet-gui-smoke-' + [guid]::NewGuid().ToString('N')
          $config = Join-Path $env:RUNNER_TEMP 'mpvnet-gui-config'
          New-Item $config -ItemType Directory -Force | Out-Null
          $pipe = [IO.Pipes.NamedPipeClientStream]::new('.', $pipeName, [IO.Pipes.PipeDirection]::InOut)
          $process = Start-Process "$package/mpvnet.exe" -ArgumentList @(
            '--idle=yes', '--vo=null', '--ao=null', '--load-scripts=no', '--process-instance=multi',
            "--config-dir=$config", "--input-ipc-server=\\.\pipe\$pipeName"
          ) -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
            $pipe.Connect(30000)
            $writer = [IO.StreamWriter]::new($pipe)
            $writer.AutoFlush = $true
            $reader = [IO.StreamReader]::new($pipe)
            $writer.WriteLine('{"command":["get_property","mpv-version"],"request_id":1}')
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $line = $reader.ReadLineAsync()
              if (-not $line.Wait(5000) -or $null -eq $line.Result -or [DateTime]::UtcNow -gt $deadline) {
                throw 'GUI did not respond to the native playback query.'
              }
              $reply = $line.Result | ConvertFrom-Json
            } while ($reply.request_id -ne 1)
            if ($reply.error -ne 'success' -or $reply.data -notmatch 'mpv ') {
              throw 'GUI failed to initialize the native playback core.'
            }
            Write-Output "GUI initialized: $($reply.data)"
            $writer.WriteLine('{"command":["quit"]}')
            if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) {
              throw 'GUI did not shut down cleanly.'
            }
          } finally {
            $pipe.Dispose()
            if (-not $process.HasExited) { $process.Kill($true) }
          }
      - name: Upload ready-to-run portable package
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-win-x64
          path: artifacts/mpv.net-win-x64/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mpv.net-win-x64
          path: package
      - name: Create portable ZIP
        working-directory: package
        run: zip -q -r "$RUNNER_TEMP/mpv.net-win-x64.zip" .
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > release-notes.md <<'EOF'
          Windows x64 portable build with Continue playback and complete stream saving using the selected audio.

          Download **mpv.net-win-x64.zip**, extract the entire archive, then run **mpvnet.exe** on Windows 10/11 x64.
          The .NET 10 runtime, libmpv, its required Vulkan loader, MediaInfo and FFmpeg are included.
          Website streams that use yt-dlp require yt-dlp.exe beside mpvnet.exe or on PATH.
          EOF
          printf '\nCommit: %s\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/mpv.net-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mpv.net Windows x64 - build $GITHUB_RUN_NUMBER" \
            --notes-file release-notes.md --latest
