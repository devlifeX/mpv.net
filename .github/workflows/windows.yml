name: Windows setup build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test parallel downloads and Windows dialog
        shell: pwsh
        run: |
          python tests/VideoDownload/run-integration.py
          if ($LASTEXITCODE) { throw 'HTTP download integration tests failed.' }
          dotnet run --project tests/VideoDownloadUI/VideoDownloadUI.csproj -p:PublishSingleFile=false -- "$env:RUNNER_TEMP/mpvnet-ui-checks"
          if ($LASTEXITCODE) { throw 'Windows dialog regression tests failed.' }
      - name: Build self-contained Windows x64 package
        shell: pwsh
        run: ./src/Tools/build-portable.ps1
      - uses: msys2/setup-msys2@v2
        with:
          install: gettext
      - name: Compile translations
        shell: msys2 {0}
        run: |
          set -euo pipefail
          for po in lang/po/*.po; do
            language="$(basename "$po" .po)"
            destination="artifacts/mpv.net-win-x64/Locale/$language/LC_MESSAGES"
            mkdir -p "$destination"
            msgfmt "$po" -o "$destination/mpvnet.mo"
          done
      - name: Build smaller package requiring .NET Desktop Runtime
        shell: pwsh
        run: |
          ./src/Tools/build-portable.ps1 -FrameworkDependent
          Copy-Item 'artifacts/mpv.net-win-x64/Locale' 'artifacts/mpv.net-win-x64-framework-dependent' -Recurse -Force
          & 'artifacts/mpv.net-win-x64-framework-dependent/mpvnet.com' --version --process-instance=multi
          if ($LASTEXITCODE) { throw 'Smaller package failed to start.' }
      - name: Build Windows installers with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'artifacts/mpv.net-win-x64'
          $output = Join-Path $PWD 'artifacts/installer'
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /Qp "/DMyAppSourceDir=$package" "/O$output" 'src/Setup/Inno/inno-setup.iss'
          if ($LASTEXITCODE) { throw 'Windows installer compilation failed.' }
          $small = Join-Path $PWD 'artifacts/mpv.net-win-x64-framework-dependent'
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /Qp "/DMyAppSourceDir=$small" /DMyAppSuffix=-framework-dependent "/O$output" 'src/Setup/Inno/inno-setup.iss'
          if ($LASTEXITCODE) { throw 'Smaller Windows installer compilation failed.' }
      - name: Install and verify every packaged file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem 'artifacts/installer/*-setup-x64.exe')
          if ($setups.Count -ne 1) { throw 'Expected exactly one Windows setup executable.' }
          $source = Join-Path $PWD 'artifacts/mpv.net-win-x64'
          $installed = Join-Path $env:RUNNER_TEMP 'mpv.net installed'
          $log = Join-Path $env:RUNNER_TEMP 'mpvnet-install.log'
          $process = Start-Process $setups[0].FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            "/DIR=`"$installed`"", "/LOG=`"$log`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $log
            throw "Setup failed with exit code $($process.ExitCode)."
          }
          foreach ($file in Get-ChildItem $source -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($source, $file.FullName)
            $target = Join-Path $installed $relative
            if (-not (Test-Path $target) -or (Get-FileHash $file.FullName).Hash -ne (Get-FileHash $target).Hash) {
              throw "Installed file is missing or differs from the build: $relative"
            }
          }
          Write-Output 'Setup installed every packaged file with matching hashes.'
      - name: Check packaged native libraries and player startup on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'mpv.net installed'
          # An installed Vulkan SDK on the runner must not hide a missing package DLL.
          $loader = Join-Path $package 'vulkan-1.dll'
          if (-not (Test-Path $loader)) { throw 'Packaged Vulkan loader is missing.' }
          $handle = [Runtime.InteropServices.NativeLibrary]::Load($loader)
          try {
            [Runtime.InteropServices.NativeLibrary]::GetExport($handle, 'vkGetInstanceProcAddr') | Out-Null
            $loaded = [Diagnostics.Process]::GetCurrentProcess().Modules |
              Where-Object { $_.ModuleName -ieq 'vulkan-1.dll' }
            if ($loaded.FileName -ine $loader) { throw 'Vulkan loader was loaded from outside the package.' }
          } finally {
            [Runtime.InteropServices.NativeLibrary]::Free($handle)
          }
          & "$package/ffmpeg.exe" -version
          if ($LASTEXITCODE) { throw 'Packaged FFmpeg failed to start.' }
          $config = Join-Path $env:RUNNER_TEMP 'mpvnet-smoke-config'
          New-Item $config -ItemType Directory -Force | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP 'mpvnet-version.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'mpvnet-errors.txt'
          $workingDirectory = Join-Path $env:RUNNER_TEMP 'unrelated working directory'
          New-Item $workingDirectory -ItemType Directory -Force | Out-Null
          $process = Start-Process "$package/mpvnet.com" -ArgumentList @(
            '--version', '--process-instance=multi', "--config-dir=$config"
          ) -WorkingDirectory $workingDirectory -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill($true)
            throw 'Packaged player startup timed out.'
          }
          $output = Get-Content $stdout -Raw
          Get-Content $stderr
          Write-Output $output
          if ($process.ExitCode -ne 0 -or $output -notmatch 'mpv.net v' -or $output -notmatch 'mpv v') {
            throw 'Packaged player did not initialize libmpv and report its version.'
          }
          if (-not (Get-ChildItem "$package/Locale" -Recurse -Filter '*.mo')) {
            throw 'Compiled translations are missing.'
          }
      - name: Start and close the packaged Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'mpv.net installed'
          $pipeName = 'mpvnet-gui-smoke-' + [guid]::NewGuid().ToString('N')
          $config = Join-Path $env:RUNNER_TEMP 'mpvnet-gui-config'
          New-Item $config -ItemType Directory -Force | Out-Null
          $pipe = [IO.Pipes.NamedPipeClientStream]::new('.', $pipeName, [IO.Pipes.PipeDirection]::InOut)
          $process = Start-Process "$package/mpvnet.exe" -ArgumentList @(
            '--idle=yes', '--vo=null', '--ao=null', '--load-scripts=no', '--process-instance=multi',
            "--config-dir=$config", "--input-ipc-server=\\.\pipe\$pipeName"
          ) -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
            $pipe.Connect(30000)
            $writer = [IO.StreamWriter]::new($pipe)
            $writer.AutoFlush = $true
            $reader = [IO.StreamReader]::new($pipe)
            $writer.WriteLine('{"command":["get_property","mpv-version"],"request_id":1}')
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $line = $reader.ReadLineAsync()
              if (-not $line.Wait(5000) -or $null -eq $line.Result -or [DateTime]::UtcNow -gt $deadline) {
                throw 'GUI did not respond to the native playback query.'
              }
              $reply = $line.Result | ConvertFrom-Json
            } while ($reply.request_id -ne 1)
            if ($reply.error -ne 'success' -or $reply.data -notmatch 'mpv ') {
              throw 'GUI failed to initialize the native playback core.'
            }
            Write-Output "GUI initialized: $($reply.data)"
            $writer.WriteLine('{"command":["quit"]}')
            if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) {
              throw 'GUI did not shut down cleanly.'
            }
          } finally {
            $pipe.Dispose()
            if (-not $process.HasExited) { $process.Kill($true) }
          }
      - name: Verify uninstall preserves user configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Join-Path $env:RUNNER_TEMP 'mpv.net installed'
          $config = Join-Path $installed 'portable_config/mpv.conf'
          New-Item (Split-Path $config) -ItemType Directory -Force | Out-Null
          'volume=42' | Set-Content $config
          $process = Start-Process "$installed/unins000.exe" -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$installed/mpvnet.exe")) {
            throw 'Uninstall failed to remove the installed application.'
          }
          if (-not (Test-Path $config) -or (Get-Content $config -Raw).Trim() -ne 'volume=42') {
            throw 'Uninstall removed or modified user configuration.'
          }
      - name: Upload tested Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-setup-x64
          path: artifacts/installer/*-setup-x64*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mpv.net-setup-x64
          path: package
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > release-notes.md <<'EOF'
          Windows x64 installers with Continue playback and a buffered-video download dialog.

          - **setup-x64.exe** includes .NET 10 and runs without a separate runtime installation.
          - **setup-x64-framework-dependent.exe** is smaller and requires the .NET 10 Desktop Runtime x64: https://dotnet.microsoft.com/download/dotnet/10.0

          Both include libmpv, its Vulkan loader, MediaInfo and FFmpeg. Direct HTTP media supports 8 connections by default (up to 32), cached chunk reuse, pause/resume, retry and a speed limit. Complete chunks can resume after restarting when saving the same unchanged source to the same destination. HLS/DASH and unsupported HTTP transports use single-connection stream completion.
          Website streams that use yt-dlp require yt-dlp.exe beside mpvnet.exe or on PATH.
          EOF
          printf '\nCommit: %s\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$RELEASE_TAG" package/*-setup-x64*.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mpv.net Windows x64 - build $GITHUB_RUN_NUMBER" \
            --notes-file release-notes.md --latest
